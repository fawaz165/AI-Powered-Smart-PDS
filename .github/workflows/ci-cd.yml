name: AI-Powered Smart PDS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Build & Run ML/API Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Benchmark PDS Datasets
        run: |
          python backend/ml/data/generate_pds_data.py

      - name: Train & Validate Demand ML Models
        run: |
          python backend/ml/train_demand_model.py

      - name: Train & Validate Anomaly Isolation Forest
        run: |
          python backend/ml/train_anomaly_model.py

      - name: Seed MongoDB Database
        env:
          MONGO_URI: mongodb://localhost:27017/smart_pds_test_db
          DB_NAME: smart_pds_test_db
        run: |
          python backend/database/seed_db.py

      - name: Execute Full Pytest Suite
        env:
          FLASK_ENV: testing
          MONGO_URI: mongodb://localhost:27017/smart_pds_test_db
          DB_NAME: smart_pds_test_db
          TEST_MONGO_URI: mongodb://localhost:27017/smart_pds_test_db
          TEST_DB_NAME: smart_pds_test_db
          SECRET_KEY: test_pipeline_secret_key_2026
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker Image Tag
        id: meta
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "tag=$DOCKERHUB_USERNAME/ai-smart-pds:latest" >> $GITHUB_OUTPUT
            echo "push=true" >> $GITHUB_OUTPUT
          else
            echo "tag=smartpds/ai-smart-pds:latest" >> $GITHUB_OUTPUT
            echo "push=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' && env.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tag }}

      - name: Report Build & Publishing Summary
        run: |
          if [ "${{ steps.meta.outputs.push }}" = "true" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "Docker image successfully built and published to Docker Hub as: ${{ steps.meta.outputs.tag }}"
          else
            echo "Docker image successfully built locally as: ${{ steps.meta.outputs.tag }}"
            echo "Docker Hub publishing skipped: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN credentials not configured."
          fi
