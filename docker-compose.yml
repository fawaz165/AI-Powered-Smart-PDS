services:
  # MongoDB Service
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      # Localhost-only binding by default to prevent public network exposure
      - "${MONGO_PORT_BINDING:-127.0.0.1:27017}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${DB_NAME:-smart_pds_db}
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pds_network

  # Web & AI Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - DEBUG=${DEBUG:-False}
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/smart_pds_db}
      - DB_NAME=${DB_NAME:-smart_pds_db}
      - SECRET_KEY=${SECRET_KEY:-}
      - MODEL_DIR=backend/ml/saved_models
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - pds_network

networks:
  pds_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
